<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Simulador de Orçamento</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <p class="marca">TECHSTORE</p>
            <h1>Simulador de Orçamento</h1>
            <p>Calcule o valor do seu pedido de forma rápida e simples.</p>
        </header>

        <section class="painel">
            <h2>Dados do pedido</h2>
            <form id="form-orcamento">
                <div class="campo">
                    <label for="valor-produto">Valor total do produto (R$)</label>
                    <input
                        type="number"
                        id="valor-produto"
                        name="valor-produto"
                        min="0.01"
                        step="0.01"
                        placeholder="Ex.: 100,00"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="pagamento">Forma de pagamento</label>
                    <select id="pagamento" name="pagamento" required>
                        <option value="">Selecione uma opção</option>
                        <option value="pix">PIX (15% de desconto)</option>
                        <option value="boleto">Boleto (10% de desconto)</option>
                        <option value="cartao-vista">Cartão à Vista (5% de desconto)</option>
                        <option value="cartao-parcelado">Cartão Parcelado (sem desconto)</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="entrega">Modalidade de frete</label>
                    <select id="entrega" name="entrega" required>
                        <option value="">Selecione uma opção</option>
                        <option value="retirada">Retirada (R$ 0,00)</option>
                        <option value="padrao">Entrega Padrão (R$ 12,00)</option>
                        <option value="expressa">Expressa (R$ 25,00)</option>
                        <option value="super-expressa">Super Expressa (R$ 45,00)</option>
                    </select>
                </div>

                <button type="submit">Calcular orçamento</button>
            </form>
        </section>

        <section id="resultado" class="resultado hidden" aria-live="polite">
            <h2>Resumo do orçamento</h2>
            <div class="linha"><span>Valor do produto</span><strong id="res-produto">R$ 0,00</strong></div>
            <div class="linha"><span>Desconto</span><strong id="res-desconto">R$ 0,00</strong></div>
            <div class="linha"><span>Frete</span><strong id="res-frete">R$ 0,00</strong></div>
            <div class="linha total"><span>Total final</span><strong id="res-total">R$ 0,00</strong></div>
        </section>

        <footer>TechStore • Simulador de orçamento</footer>
    </main>
</body>
</html>
